name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src assets _site/
          touch _site/.nojekyll

      - name: Enable GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --method POST \
            -f build_type=legacy \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
          status=$?
          if [ "$status" -ne 0 ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pages" \
              --method PUT \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
